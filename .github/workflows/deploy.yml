name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show OIDC claims (temporary)
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          python3 - "$TOKEN" <<'PY'
          import sys, base64, json
          p = sys.argv[1].split('.')[1]
          p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print('sub:', c['sub'])
          print('aud:', c['aud'])
          print('repository:', c['repository'])
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Sync to S3
        run: >
          aws s3 sync . s3://ianhefflefingerdotcom --delete
          --exclude ".git/*" --exclude ".github/*" --exclude ".gitignore"
          --exclude ".DS_Store" --exclude "README.md"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E3SC1A3EAUY97I --paths "/*"
